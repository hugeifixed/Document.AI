<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DocAI Platform</title>
    <script>
      // Stamp the stored theme before first paint to avoid flash-of-wrong-theme (DESIGN.md §13).
      try {
        var raw = localStorage.getItem("docai-prefs");
        var t = raw ? JSON.parse(raw).state.theme : "system";
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", "extract-" + t);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-base-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
