[project]
name = "docai-platform"
version = "1.0.0"
description = "Enterprise document AI platform: unbundling, classification, extraction, labeling, review, evaluation (Django 5.2 sub-application)"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "django-filter==26.1",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.9.1",
    "django-model-utils==5.0.0",
    "django-health-check==4.5.1",
    "django-silky==1.5.1",
    "django-unfold==0.104.1",
    "dj-cache-panel==0.6.0",
    "django-cors-headers==4.9.0",
    "loguru==0.7.3",
    "pydantic==2.13.5",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "azure-identity==1.25.3",
    "azure-ai-documentintelligence==1.0.2",
    "pypdf==6.16.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "rapidfuzz==3.14.6",
    "python-dateutil==2.9.0.post0",
    "environs==15.2.0",
    "dj-database-url==3.1.2",
]

[project.optional-dependencies]
image-normalization = [
    "Pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "pypdfium2==5.13.0",
    "numpy==2.5.2",
]
celery = [
    "celery==5.6.3",
    "dj-celery-panel==0.6.0",
    "pywin32==312; sys_platform == 'win32'",
]
redis = [
    "dj-redis-panel==0.10.0",
    "redis==6.4.0",
]
oracle = [
    "oracledb==4.0.2",
]
dev = [
    "django-stubs==6.1.0",
    "djangorestframework-stubs==3.18.1",
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
    "types-django-filter==26.1.0.20260807",
    "types-openpyxl==3.1.5.20260827",
    "types-python-dateutil==2.9.0.20260716",
    "types-PyYAML==6.0.12.20260815",
    "types-xlrd==2.0.0.20260518",
]

# Artifactory policy: allow only distribution files uploaded more than seven days ago.
[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["docai/tests"]
addopts = "-q --strict-config --strict-markers"

[tool.coverage.run]
omit = ["docai/tests/*"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
exclude = ["docai/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
strict_settings = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff owns linting, import sorting, security checks, and formatting for backend Python code.
select = ["F", "I", "B", "BLE", "C4", "C90", "DTZ", "S", "SIM", "T10", "T20", "UP"]

[tool.ruff.lint.mccabe]
# This matches the current maximum and prevents complexity from increasing. Reduce it as the
# ingestion workflow is split into smaller units.
max-complexity = 24

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # Layered Django settings intentionally use star imports.
"docai/migrations/*.py" = ["I001"]  # Preserve generated migration files.
"docai/synthetic/*.py" = ["S311"]  # Deterministic fixture variation is not used for security decisions.
"docai/tests/*.py" = ["S101", "S106", "S107"]  # Assertions and test-only passwords are intentional.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docai*", "config*"]

[tool.setuptools.package-data]
docai = ["static/docai/css/*.css", "templates/**/*.html"]
config = ["templates/**/*.html"]
