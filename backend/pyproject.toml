[project]
name = "docai-platform"
version = "1.0.0"
description = "Enterprise document AI platform: unbundling, classification, extraction, labeling, review, evaluation (Django 5.2 sub-application)"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.17",
    "djangorestframework==3.18.0",
    "django-filter==26.1",
    "drf-spectacular==0.30.0",
    "drf-spectacular-sidecar==2026.9.1",
    "django-model-utils==5.0.0",
    "django-health-check==3.24.0",  # 4.x removes the configured health_check apps and URLs.
    "django-unfold==0.104.1",
    "dj-cache-panel==0.6.0",
    "django-cors-headers==4.9.0",
    "loguru==0.7.3",
    "pydantic==2.13.5",
    "langchain-core==1.6.1",
    "langchain-openai==1.6.0",
    "azure-identity==1.25.3",
    "azure-ai-documentintelligence==1.0.2",
    "pypdf==6.16.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "rapidfuzz==3.14.6",
    "python-dateutil==2.9.0.post0",
    "environs==15.2.0",
    "dj-database-url==3.1.2",
]

[project.optional-dependencies]
celery = [
    "celery==5.6.3",
    "dj-celery-panel==0.6.0",
    "pywin32==312; sys_platform == 'win32'",
]
redis = [
    "dj-redis-panel==0.10.0",
    "redis==6.4.0",
]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]

# Artifactory policy: allow only distribution files uploaded more than seven days ago.
[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["docai/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep automated checks focused on correctness and maintainability. Style-only formatting is
# intentionally left to incremental refactors of the existing compact modules.
select = ["F", "I", "B", "BLE", "C4", "C90", "DTZ", "S", "SIM", "T10", "T20", "UP"]

[tool.ruff.lint.mccabe]
# This matches the current maximum and prevents complexity from increasing. Reduce it as the
# ingestion workflow is split into smaller units.
max-complexity = 24

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # Layered Django settings intentionally use star imports.
"docai/migrations/*.py" = ["I001"]  # Preserve generated migration files.
"docai/synthetic/*.py" = ["S311"]  # Deterministic fixture variation is not used for security decisions.
"docai/tests/*.py" = ["S101", "S106", "S107"]  # Assertions and test-only passwords are intentional.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docai*", "config*"]

[tool.setuptools.package-data]
docai = ["static/docai/css/*.css", "templates/**/*.html"]
config = ["templates/**/*.html"]
