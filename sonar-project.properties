# The institution supplies sonar.projectKey, sonar.host.url, and authentication in CI.
sonar.sources=backend/docai
sonar.tests=backend/docai/tests
sonar.test.inclusions=backend/docai/tests/**/*.py
sonar.exclusions=backend/docai/migrations/**,backend/docai/tests/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.sourceEncoding=UTF-8
