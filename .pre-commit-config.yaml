# External hook revisions are pinned to releases older than seven days to
# satisfy the institutional artifact-admission policy.
repos:
  # Keep the hook configuration itself honest as files and patterns evolve.
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # Small, language-agnostic checks that complement Ruff.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: backend trailing whitespace
        args: [--markdown-linebreak-ext=md]
        files: ^backend/
      - id: trailing-whitespace
        name: CLI trailing whitespace
        args: [--markdown-linebreak-ext=md]
        files: ^cli/
      - id: end-of-file-fixer
        name: backend final newline
        files: ^backend/
      - id: end-of-file-fixer
        name: CLI final newline
        files: ^cli/
      - id: fix-byte-order-marker
        name: backend UTF-8 byte order marker
        files: ^backend/
      - id: fix-byte-order-marker
        name: CLI UTF-8 byte order marker
        files: ^cli/
      - id: mixed-line-ending
        name: backend LF line endings
        args: [--fix=lf]
        files: ^backend/
      - id: mixed-line-ending
        name: CLI LF line endings
        args: [--fix=lf]
        files: ^cli/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: name-tests-test
        name: backend test naming
        args: [--django]
        files: ^backend/docai/tests/.+\.py$
      - id: check-added-large-files
        name: backend large files
        files: ^backend/
      - id: check-added-large-files
        name: CLI large files
        files: ^cli/

  # Validate standard project metadata in addition to TOML syntax.
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        files: ^(backend|cli)/pyproject\.toml$

  # Scan the staged diff for credentials and tokens. Gitleaks redacts any
  # finding from hook output so a detected secret is not printed to the log.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Keep code current with the Django version supported by this application.
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.2"]
        files: ^backend/.*\.py$

  # Frontend checks are owned by frontend/package.json and dispatched by Husky.
  - repo: local
    hooks:
      - id: backend-ruff
        name: backend lint and complexity
        entry: uv run --directory backend --no-sync ruff check --fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.(py|toml)$

      - id: backend-ruff-format
        name: backend Ruff formatting
        entry: uv run --directory backend --no-sync ruff format --check .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$

      - id: backend-mypy
        name: backend type checking
        entry: uv run --directory backend --no-sync mypy config docai
        language: system
        pass_filenames: false
        files: ^backend/.*\.(py|toml)$

      - id: backend-coverage
        name: backend tests and coverage
        entry: >-
          uv run --directory backend --no-sync pytest
          --cov=docai --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
        language: system
        pass_filenames: false
        files: ^backend/.*\.(py|toml)$

      - id: cli-ruff
        name: CLI lint
        entry: uv run --directory cli --project . --no-sync ruff check src tests
        language: system
        pass_filenames: false
        files: ^cli/.*\.(py|toml)$

      - id: cli-ruff-format
        name: CLI Ruff formatting
        entry: uv run --directory cli --project . --no-sync ruff format --check src tests
        language: system
        pass_filenames: false
        files: ^cli/.*\.py$

      - id: cli-mypy
        name: CLI type checking
        entry: uv run --directory cli --project . --no-sync mypy src/docai_cli
        language: system
        pass_filenames: false
        files: ^cli/.*\.(py|toml)$

      - id: cli-coverage
        name: CLI tests and coverage
        entry: >-
          uv run --directory cli --project . --no-sync pytest
          --cov=docai_cli --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-fail-under=80
        language: system
        pass_filenames: false
        files: ^cli/.*\.(py|toml)$
